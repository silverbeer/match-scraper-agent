apiVersion: batch/v1
kind: CronJob
metadata:
  name: match-scraper-agent-weekend
  namespace: match-scraper
spec:
  schedule: "0 5,11,17,23 * * 0,6"  # 4 extra slots Sat/Sun (05:00, 11:00, 17:00, 23:00 UTC)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: agent
              image: ghcr.io/silverbeer/match-scraper-agent:latest
              imagePullPolicy: Always
              args: ["run", "--env", "prod"]
              envFrom:
                - configMapRef:
                    name: match-scraper-agent-config
                - secretRef:
                    name: match-scraper-agent-secret
              resources:
                requests:
                  cpu: 200m
                  memory: 1Gi
                limits:
                  cpu: "1"
                  memory: 2Gi
